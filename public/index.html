<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>N&R SOLARTECH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#F7F8FA;line-height:1.5;color:#0F172A;min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:620px;margin:0 auto;padding:16px;width:100%}
h1{font-size:30px;font-weight:800;color:#0F172A;text-align:center;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700;color:#0F172A;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}.hic{width:21px;height:21px;flex:none;color:#0369A1;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:7px;padding:3px;box-sizing:content-box}
/* On a light page a white card needs a hairline and a shallow shadow, or it
   dissolves into the background. Kept to one weight so the page does not turn
   into a stack of identical floating boxes. */
/* Icons take their size from the text they sit beside and their colour from
   whatever already set it, so there is no second palette to maintain. */
.ic{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.15em;
    flex:none;margin-right:.35em}
.btn .ic{margin-right:.3em}
.card{background:#FFFFFF;border:1px solid #E8ECF1;border-radius:14px;padding:14px;
      margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.04);animation:slideUp .3s ease}
.card h2{margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #E3E8EF}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fg{margin-bottom:8px}
.fg label{display:block;font-size:15px;color:#5A6B7F;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:9px;border:1px solid #E3E8EF;border-radius:8px;background:#FFFFFF;color:#0F172A;font-size:17px;transition:border .2s}
.fg input:focus,.fg textarea:focus{border-color:#0369A1;outline:none;box-shadow:0 0 0 2px rgba(56,189,248,.15)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.97)}.btn:hover{opacity:.9;transform:translateY(-1px)}
.bp{background:#0369A1;color:#fff}.bs{background:#15803D;color:#fff}
.bd{background:#B91C1C;color:#fff}.by{background:#B45309;color:#fff}
.bg{background:#E3E8EF;color:#5A6B7F}.bv{background:#6D28D9;color:#fff}
.btn.full{width:100%}
.badge{padding:3px 10px;border-radius:6px;font-size:14px;font-weight:700;text-transform:uppercase;display:inline-block;letter-spacing:.5px}
.badge.green{background:#DCFCE7;color:#15803D}.badge.red{background:#FEE2E2;color:#B91C1C}
.badge.yellow{background:#FEF3C7;color:#B45309}.badge.blue{background:#EFF6FF;color:#0369A1}
.badge.gray{background:#E3E8EF;color:#64748B}
.stat{background:#FFFFFF;border-radius:10px;padding:14px;text-align:center;flex:1;min-width:80px}
.stat .v{font-size:25px;font-weight:800;font-family:monospace}
.stat .l{font-size:13px;color:#5A6B7F;text-transform:uppercase;margin-top:4px;letter-spacing:1px}
.msg{padding:12px;border-radius:10px;margin-bottom:12px;font-size:16px;font-weight:600;text-align:center;cursor:pointer;animation:fadeIn .2s}
.pbar{width:100%;height:6px;background:#E3E8EF;border-radius:3px;overflow:hidden;margin-top:6px}.pbar .fill{height:100%;background:#15803D;border-radius:3px;transition:width .2s;width:0%}
.msg.ok{background:linear-gradient(135deg,#DCFCE7,#DCFCE7);color:#fff;border:1px solid #15803D}.msg.er{background:linear-gradient(135deg,#B91C1C,#FEE2E2);color:#fff;border:1px solid #B91C1C}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:7px 14px;background:#FFFFFF;border:none;border-radius:8px;color:#5A6B7F;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.tabs button:hover{background:#E3E8EF;color:#0F172A}
.tabs button.active{background:linear-gradient(135deg,#B45309,#B45309);color:#0F172A;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.tabs button.activeb{background:linear-gradient(135deg,#0369A1,#0369A1);color:#0F172A;box-shadow:0 2px 8px rgba(56,189,248,.3)}
.mono{font-family:monospace}.gold{color:#B45309}
.dv{border-top:1px solid #E3E8EF;margin-top:12px;padding-top:12px}
.ft{text-align:center;font-size:14px;color:#64748B;padding:16px 0}
.ft a{color:#0369A1;text-decoration:none}
.logrow{background:#FFFFFF;border-radius:8px;padding:10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.logrow .meta{font-size:13px;color:#64748B;text-align:right}
.price-box{background:linear-gradient(160deg,#F0FDF4,#DCFCE7);border:1px solid #15803D;border-radius:14px;padding:12px;margin-bottom:8px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.price-box .amt{font-size:44px;font-weight:800;color:#DCFCE7;letter-spacing:-.03em}
.warn{background:#FEE2E2;border:1px solid #B91C1C;border-radius:8px;padding:10px;font-size:15px;color:#B91C1C}
.loading{text-align:center;padding:30px;color:#64748B}
.pmrow{background:#FFFFFF;border-radius:8px;padding:8px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.hero{text-align:center;padding:30px 16px 20px;
      background:linear-gradient(180deg,#EFF6FF 0%,#F7F8FA 100%);
      border:1px solid #E3EBF5;border-radius:20px;margin-bottom:12px}
.hero .brand{font-size:15px;color:#B45309;font-weight:700;letter-spacing:.28em;cursor:default;user-select:none}
.hero h1{margin-top:8px;background:linear-gradient(100deg,#0F172A 0%,#0F172A 55%,#0369A1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:#5A6B7F;font-size:17px;margin-top:8px}
.trust{display:flex;justify-content:center;gap:20px;margin-top:16px}
.trust .ti{text-align:center}
.trust .tv{font-size:23px;font-weight:800;color:#15803D}
.trust .tl{font-size:13px;color:#5A6B7F;text-transform:uppercase;letter-spacing:1px}
.hiw{display:flex;gap:8px;margin-top:12px}
.hiw .step{flex:1;background:#FFFFFF;border-radius:10px;padding:12px 8px;text-align:center;position:relative}
.hiw .sn{width:28px;height:28px;background:linear-gradient(135deg,#B45309,#B45309);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#0F172A;margin:0 auto 8px}
.hiw .st{font-size:15px;color:#0F172A;line-height:1.4}
.faq-item{background:#FFFFFF;border-radius:10px;margin-bottom:6px;overflow:hidden;border:1px solid #FFFFFF;transition:border .2s}
.faq-item:hover{border-color:#E3E8EF}
.faq-q{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:#0F172A}
.faq-q .arrow{color:#B45309;font-size:19px;transition:transform .2s}
.faq-a{padding:0 14px 12px;font-size:15px;color:#5A6B7F;line-height:1.6;display:none}
.faq-item.open .faq-a{display:block}.faq-item.open .arrow{transform:rotate(180deg)}
.social{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.social a{background:#FFFFFF;border-radius:8px;padding:8px 14px;text-decoration:none;color:#0F172A;font-size:14px;font-weight:600;transition:all .15s;border:1px solid #E3E8EF}
.social a:hover{background:#E3E8EF;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.social a .si{font-size:17px;display:block;margin-bottom:1px}
.search-box{background:#FFFFFF;border:1px solid #E3E8EF;border-radius:8px;padding:8px 12px;color:#0F172A;font-size:16px;width:100%;margin-bottom:10px}
.search-box:focus{border-color:#0369A1;outline:none}
@media(min-width:768px){.app{max-width:740px;padding:24px}h1{font-size:34px}.card{padding:20px}.stat .v{font-size:30px}.btn{padding:10px 22px;font-size:16px}.fg input,.fg select,.fg textarea{padding:11px;font-size:18px}.tabs button{padding:9px 18px;font-size:15px}.price-box{padding:28px}.price-box .amt{font-size:52px}.hero{padding:50px 0 24px}.hiw .st{font-size:15px}}
@media(min-width:1024px){.app{max-width:920px;padding:32px}h1{font-size:38px}.card{padding:22px}.stat{padding:18px}.stat .v{font-size:34px}.g2{gap:14px}.price-box{padding:32px}.price-box .amt{font-size:60px}}
@media(max-width:380px){.app{padding:10px}h1{font-size:23px}.g2{grid-template-columns:1fr;gap:6px}.hiw{flex-direction:column}.stat .v{font-size:21px}.stat{min-width:60px;padding:10px}.price-box .amt{font-size:34px}.tabs button{padding:5px 10px;font-size:14px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const SB='https://sdviemivuftnsytmnqaq.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkdmllbWl2dWZ0bnN5dG1ucWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMzAwMTcsImV4cCI6MjA4ODYwNjAxN30.iRSuCtEullsSaV_1hYAqPj_sywXdy-4U3WfHjIYCB4U';
async function pubGet(t,q){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),5000);try{const r=await fetch(SB+'/rest/v1/'+t+'?'+(q||'select=*'),{headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Accept':'application/json'},signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw new Error(await r.text());return r.json();}catch(e){clearTimeout(timer);throw e;}}
// SessionStorage cache for public landing data — reduces Supabase hits on repeat visits
// Cache expires after 5 minutes. Admin/license/payment data is never cached.
function scGet(k){try{var e=JSON.parse(sessionStorage.getItem('nr_'+k)||'null');if(!e)return null;if(Date.now()-e.t>300000){sessionStorage.removeItem('nr_'+k);return null;}return e.d;}catch(x){return null;}}
function scSet(k,d){try{sessionStorage.setItem('nr_'+k,JSON.stringify({d:d,t:Date.now()}));}catch(x){}}
async function pubGetCached(t,q){var k=t+'_'+( q||'');var cached=scGet(k);if(cached)return cached;var d=await pubGet(t,q);scSet(k,d);return d;}
function scClearAll(){try{var keys=[];for(var i=0;i<sessionStorage.length;i++){var k=sessionStorage.key(i);if(k&&k.indexOf('nr_')===0)keys.push(k);}keys.forEach(function(k){sessionStorage.removeItem(k);});}catch(x){}}
let authToken=localStorage.getItem('nr_token')||'';
function saveToken(t){authToken=t;if(t)localStorage.setItem('nr_token',t);else localStorage.removeItem('nr_token');}
function saveUser(u,t){if(u)localStorage.setItem('nr_user',JSON.stringify(u));else localStorage.removeItem('nr_user');if(t)localStorage.setItem('nr_ut',t);else localStorage.removeItem('nr_ut');}
function loadUser(){try{var u=JSON.parse(localStorage.getItem('nr_user'));var t=localStorage.getItem('nr_ut');if(u&&authToken){ST.user=u;ST.ut=t;}}catch(e){}}
async function api(body){const h={'Content-Type':'application/json'};if(authToken)h['Authorization']='Bearer '+authToken;const r=await fetch('/api',{method:'POST',headers:h,body:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401&&body.action!=='login'&&body.action!=='register'&&body.action!=='admin_login'){saveToken('');saveUser(null,null);ST.user=null;ST.ut=null;nav('landing');showMsg('er','Session expired. Please login again.');}throw new Error(d.error||d.message||'Error');}return d;}
function $(id){return document.getElementById(id)}
function fd(d){return d?new Date(d).toLocaleString():'-'}
function bg(s){const c={active:'green',inactive:'yellow',suspended:'red',revoked:'gray',pending:'yellow',approved:'green',rejected:'red',Available:'yellow',Activated:'green'};return'<span class="badge '+(c[s]||'gray')+'">'+s+'</span>';}
function ck(k){try{navigator.clipboard.writeText(k)}catch(e){}showMsg('ok','Copied!')}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let ST={page:'landing',user:null,ut:null,msg:null,tab:'licenses',at:'dashboard'};
let SS={},PM=[],DL=[],PD=[],AD={},tapN=0,tapT=null,searchQ='';
let custCache=null; // Cache customer data

function showMsg(t,m){
  // Use floating toast - don't re-render page
  var old=$('toast');if(old)old.remove();
  var d=document.createElement('div');d.id='toast';d.className='msg '+t;d.textContent=m;d.onclick=function(){d.remove();};
  document.body.appendChild(d);
  Object.assign(d.style,{position:'fixed',top:'12px',left:'50%',transform:'translateX(-50%)',zIndex:'9999',maxWidth:'90%',width:'500px'});
  setTimeout(function(){if(d.parentNode)d.remove();},3000);
}
async function nav(p){ST.page=p;render();if(p==='landing'){var _fr=await Promise.race([Promise.all([pubGetCached('site_settings','id=eq.1').catch(function(){return [];}),pubGetCached('payment_methods','active=eq.true&order=sort_order').catch(function(){return [];}),pubGetCached('downloads','active=eq.true&order=sort_order').catch(function(){return [];}),pubGetCached('products','active=eq.true&order=sort_order').catch(function(){return [];})]),new Promise(function(resolve){setTimeout(function(){resolve([[],[],[],[]]);},6000);})]);var ss=_fr[0],pm=_fr[1],dl=_fr[2],pd=_fr[3];if(ss&&ss[0])SS=ss[0];PM=pm||[];DL=dl||[];PD=pd||[];render();}}
function logoTap(){tapN++;if(tapT)clearTimeout(tapT);if(tapN>=5){tapN=0;nav('adminLogin');return;}tapT=setTimeout(()=>tapN=0,2000);}
function logout(){ST.user=null;ST.ut=null;saveToken('');saveUser(null,null);try{sessionStorage.removeItem('nrActive');}catch(e){}nav('landing');}
function togFaq(el){el.parentElement.classList.toggle('open');}

function render(){
  const a=$('app');let h='';
  switch(ST.page){
    case'landing':h+=pgLanding();break;case'customerLogin':h+=pgLogin('Customer Login','#0369A1','doLogin');break;
    case'register':h+=pgRegister();break;case'forgot':h+=pgForgot();break;case'adminLogin':h+=pgLogin('Developer Login','#B45309','doAdminLogin');break;case'adminForgot':h+=pgAdminForgot();break;
    case'customer':h+=pgCustomer();break;case'admin':h+=pgAdmin();break;default:h+=pgLanding();
  }
  a.innerHTML=h;
  if(ST.page==='customer')setTimeout(loadCust,50);
  if(ST.page==='admin')setTimeout(loadAdmin,50);
}

// ====== LANDING ======
function pgLanding(){
  var s=SS,pm=PM||[];
  var features=(s.features||'').split(',').filter(Boolean);
  var hiw=(s.how_it_works||'').split(',').filter(Boolean);
  var faqRaw=(s.faq||'').split('||').filter(Boolean);
  var faqs=faqRaw.map(function(f){var p=f.split('|');return{q:p[0]||'',a:p[1]||''};});

  var h='<div class="hero"><div class="brand" onclick="logoTap()">'+esc(s.brand_name||'N&R SOLARTECH')+'</div><h1>'+esc(s.site_title||'Smart CarWash')+'</h1><p>'+esc(s.site_subtitle||'')+'</p>'
  +'<div class="trust"><div class="ti"><div class="tv">'+(s.customers_count||'50+')+'</div><div class="tl">'+(s.trust_label1||'Customers')+'</div></div><div class="ti"><div class="tv" style="color:#0369A1">'+(s.trust_value2||'24/7')+'</div><div class="tl">'+(s.trust_label2||'Support')+'</div></div><div class="ti"><div class="tv" style="color:#B45309">'+(s.trust_value3||'Free')+'</div><div class="tl">'+(s.trust_label3||'Updates')+'</div></div></div></div>';

  // How it works
  if(hiw.length){h+='<div class="card"><h2><svg class="hic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V9a2 2 0 0 1 2-2h6v9"/><path d="M4 16h8"/><path d="M15 9h2.5L20 12v4h-5z"/><path d="M17 5.5 19.5 3M20 8h3M17.5 11 20 13"/></svg><span>How It Works</span></h2><div class="hiw">';hiw.forEach(function(s,i){h+='<div class="step"><div class="sn">'+(i+1)+'</div><div class="st">'+esc(s.trim())+'</div></div>';});h+='</div></div>';}

  // Features
  if(features.length){h+='<div class="card"><h2><svg class="hic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.4 9l5.6.5-4.3 3.8 1.3 5.6L12 16l-5 2.9 1.3-5.6L4 9.5 9.6 9z"/></svg><span>Features</span></h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px">';features.forEach(function(f){h+='<div style="display:flex;align-items:center;gap:6px;padding:3px 0"><span style="color:#15803D;font-size:15px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><span style="font-size:15px">'+esc(f.trim())+'</span></div>';});h+='</div></div>';}

  // Products (firmware + pricing)
  if(PD.length){
    h+='<div class="card"><h2><svg class="hic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><rect x="9" y="10" width="6" height="4" rx="1"/><path d="M9 5V3M15 5V3M9 21v-2M15 21v-2M4 10H2M4 14H2M22 10h-2M22 14h-2"/></svg><span>Products & Firmware</span></h2><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">';
    PD.forEach(function(p){if(!p.firmware_file)return;h+='<button class="btn full" style="flex:1;min-width:120px;max-width:calc(50% - 4px);padding:10px;border-radius:10px;background:'+esc(p.color||'#0369A1')+';color:#fff" onclick="dlProduct(\''+esc(p.firmware_file)+'\')"><div style="font-size:16px;font-weight:700">'+esc(p.name)+'</div><div style="font-size:13px;opacity:.5;margin-top:2px">Tap to Download</div></button>';});
    h+='</div>'+(s.flash_instructions?'<details style="margin-top:10px"><summary style="font-size:15px;color:#5A6B7F;cursor:pointer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg> Flashing Instructions</summary><pre style="font-size:15px;color:#334155;background:#FFFFFF;border-radius:8px;padding:10px;margin-top:6px;white-space:pre-wrap;border:1px solid #E3E8EF">'+esc(s.flash_instructions)+'</pre></details>':'')+'</div>';
    // Price cards per product
    h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;justify-content:center">';
    PD.forEach(function(p){h+='<div style="flex:1;min-width:120px;max-width:calc(33.3% - 6px);background:linear-gradient(135deg,#DCFCE7,#DCFCE7);border:1px solid '+(p.color||'#15803D')+';border-radius:10px;padding:10px;text-align:center"><div style="font-size:14px;color:'+esc(p.color||'#15803D')+';font-weight:700">'+esc(p.name)+'</div><div style="font-size:13px;color:#15803D;letter-spacing:1px;margin-top:1px">'+esc(p.price_label||'ONE-TIME PAYMENT')+'</div><div style="font-size:21px;font-weight:800;color:#0F172A;margin:2px 0;letter-spacing:-.02em">₱'+(p.price||500)+'</div>'+(p.description?'<div style="font-size:13px;color:#5A6B7F">'+esc(p.description)+'</div>':'')+'</div>';});
    h+='</div>';
  }
  // Base price (shows when no products, or always as starting price)
  if(!PD.length){
    h+='<div style="display:flex;justify-content:center;margin-bottom:8px"><div style="background:linear-gradient(135deg,#DCFCE7,#DCFCE7);border:1px solid #15803D;border-radius:10px;padding:10px;text-align:center;min-width:160px"><div style="font-size:13px;color:#15803D;letter-spacing:1px">'+esc(s.price_label||'STARTING AT')+'</div><div style="font-size:21px;font-weight:800;color:#0F172A;margin:2px 0;letter-spacing:-.02em">₱'+(s.price||500)+'</div>'+(s.price_note?'<div style="font-size:13px;color:#5A6B7F">'+esc(s.price_note)+'</div>':'')+'</div></div>';
  }

  // Tools & Downloads

async function submitPay(){

function updBuyPrice(){

function downloadGenKeys(){
  var cbs=document.querySelectorAll('.genCb:checked');
  if(!cbs.length)return showMsg('er','Select keys to download');
  var lics=AD.licenses||[];
  var lines=[];
  lines.push('N&R SOLARTECH - Generated License Keys');
  lines.push('Downloaded: '+new Date().toLocaleString());
  lines.push('');
  lines.push('='.repeat(50));
  lines.push('');
  var count=0;
  cbs.forEach(function(cb){
    var l=lics.find(function(x){return x.key===cb.value;});
    if(l){
      count++;
      var sl=l.status==='inactive'?'AVAILABLE':l.status==='active'?'ACTIVATED':l.status==='suspended'?'SUSPENDED':'REVOKED';
      lines.push('  '+count+'.  '+l.key);
      lines.push('      Status:     '+sl);
      lines.push('      Generated:  '+(l.created_at?new Date(l.created_at).toLocaleString():'N/A'));
      lines.push('');
    }
  });
  lines.push('='.repeat(50));
  lines.push('');
  lines.push('  Total: '+count+' license key(s)');
  lines.push('');
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='NR_Generated_Keys_'+new Date().toISOString().slice(0,10)+'.txt';a.click();
  showMsg('ok','Downloaded '+count+' keys');
}

function uploadWithProgress(url,file,headers,barId){return new Promise(function(resolve,reject){var xhr=new XMLHttpRequest();xhr.open('PUT',url);Object.keys(headers).forEach(function(k){xhr.setRequestHeader(k,headers[k]);});var bar=$(barId);if(bar){bar.style.display='block';bar.innerHTML='<div style="display:flex;align-items:center;gap:6px;margin-top:6px"><span style="color:#5A6B7F;font-size:14px">Uploading</span><div class="pbar" style="flex:1"><div class="fill"></div></div><span class="ptxt" style="color:#15803D;font-size:14px;font-weight:700">0%</span></div>';}xhr.upload.onprogress=function(e){if(e.lengthComputable&&bar){var pct=Math.round(e.loaded/e.total*100);bar.querySelector('.fill').style.width=pct+'%';bar.querySelector('.ptxt').textContent=pct+'%';}};xhr.onload=function(){if(bar){bar.querySelector('.fill').style.width='100%';bar.querySelector('.ptxt').textContent='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';setTimeout(function(){bar.style.display='none';},1000);}if(xhr.status>=200&&xhr.status<300)resolve();else reject(new Error(xhr.responseText||'Upload failed'));};xhr.onerror=function(){if(bar){bar.innerHTML='<div style="color:#B91C1C;font-size:14px;margin-top:4px">Upload failed</div>';}reject(new Error('Network error'));};xhr.send(file);});}
async function upProductFW(input,id){var file=input.files[0];if(!file)return;if(!file.name.endsWith('.bin')){showMsg('er','Only .bin files!');input.value='';return;}try{var fn=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');await uploadWithProgress(SB+'/storage/v1/object/firmware/'+fn,file,{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/octet-stream','x-upsert':'true'},'pb_'+id.replace(/-/g,''));await api({action:'update_product',id:id,firmware_file:fn,firmware_version:fn.replace('.bin','')});scClearAll();PD=[];PM=[];SS={};showMsg('ok','<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> '+fn+' uploaded!');loadAdmin(true);}catch(e){showMsg('er',e.message);}input.value='';}
async function rmProductFW(id){if(!confirm('Remove firmware? Download button will be hidden on landing page.'))return;try{await api({action:'update_product',id:id,firmware_file:''});scClearAll();PD=[];PM=[];SS={};showMsg('ok','Firmware removed. Landing page updated.');loadAdmin(true);}catch(e){showMsg('er',e.message);}}
async function updateProductVer(id){var vid='pv_'+id.replace(/-/g,'');var v=($(vid)||{}).value;try{await api({action:'update_product',id:id,firmware_version:v});scClearAll();showMsg('ok','Version saved!');}catch(e){showMsg('er',e.message);}}
async function saveSets(){try{var feat=($('sf')||{}).value||'';feat=feat.split(/[\n,]/).map(function(f){return f.trim()}).filter(Boolean).join(',');var faq=($('sfaq')||{}).value||'';faq=faq.split(/\n\n+/).map(function(f){return f.trim()}).filter(Boolean).join('||');var d={brand_name:($('sb')||{}).value,site_title:($('stt')||{}).value,site_subtitle:($('ss')||{}).value,customers_count:($('stb1')||{}).value,trust_label1:($('stb1l')||{}).value,trust_value2:($('stb2')||{}).value,trust_label2:($('stb2l')||{}).value,trust_value3:($('stb3')||{}).value,trust_label3:($('stb3l')||{}).value,features:feat,how_it_works:($('shiw')||{}).value,price_label:($('spl')||{}).value,price:parseInt(($('sp')||{}).value)||500,price_note:($('spn')||{}).value,bulk_price_1:parseInt(($('sbp1')||{}).value)||650,bulk_price_2:parseInt(($('sbp2')||{}).value)||550,bulk_price_3:parseInt(($('sbp3')||{}).value)||500,faq:faq,social_facebook:($('sfb')||{}).value,social_fbpage:($('sfp')||{}).value,social_whatsapp:($('swa')||{}).value,social_youtube:($('syt')||{}).value,contact_phone:($('scp')||{}).value,support_text:($('sst')||{}).value,footer_text:($('sft')||{}).value,announcement:($('san')||{}).value,lcd_version:($('sv1')||{}).value,seg_version:($('sv2')||{}).value,flash_instructions:($('si')||{}).value,wiring_guide:($('sw')||{}).value,tutorial_videos:(AD.settings&&AD.settings.tutorial_videos)||'[]'};await api({action:'save_settings',settings:d});Object.assign(SS,d);if(AD.settings)Object.assign(AD.settings,d);scClearAll();PD=[];PM=[];SS={};showMsg('ok','Saved!');}catch(e){showMsg('er',e.message);}}
async function changeAdmin(){var email=($('anew')||{}).value,bk=($('abk')||{}).value,sn=($('asn')||{}).value,pw=($('apw')||{}).value,pw2=($('apw2')||{}).value;if(pw&&pw!==pw2)return showMsg('er','Passwords do not match');if(pw&&pw.length<6)return showMsg('er','Password must be 6+ characters');if(sn&&(sn.length<4||sn.length>6))return showMsg('er','Secret number must be 4-6 digits');try{await api({action:'change_admin',email:email||'',password:pw||'',backupEmail:bk,secret:sn});showMsg('ok','Admin credentials updated!');if(email)ST.user.email=email;if(bk)ST.user.backup_email=bk;if(sn)ST.user.secret_number=sn;saveUser(ST.user,ST.ut);}catch(e){showMsg('er',e.message);}}
async function saveTelegram(){try{await api({action:'save_settings',settings:{telegram_bot_token:($('tgbt')||{}).value||'',telegram_chat_id:($('tgci')||{}).value||'',telegram_notify:($('tgon')||{}).checked||false}});showMsg('ok','Telegram settings saved!');}catch(e){showMsg('er',e.message);}}
async function testTelegram(){try{await api({action:'test_telegram'});showMsg('ok','Test notification sent!');}catch(e){showMsg('er',e.message);}}
async function connectBot(){try{var r=await api({action:'set_telegram_webhook'});if(r.success)showMsg('ok','Bot connected! Commands: /pending /approve /reject /stats /help');else showMsg('er',r.result||'Failed');} catch(e){showMsg('er',e.message);}}
async function recoverLic(){
  var key=($('recoverKey')||{}).value.trim().toUpperCase();
  if(!key)return showMsg('er','Enter a license key to recover');
  if(!/^NR-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(key))return showMsg('er','Invalid format. Must be NR-XXXX-XXXX-XXXX');
  if(!confirm('Recover license key: '+key+'?\nThis will make it available for the customer to claim again.'))return;
  try{var r=await api({action:'recover_license',key:key});showMsg('ok','<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> '+r.message);if($('recoverKey'))$('recoverKey').value='';loadAdmin(true);}catch(e){showMsg('er',e.message);}
}
async function resetPayments(){var pw=($('dangerPw')||{}).value;if(!pw)return showMsg('er','Enter admin password first');if(!confirm('Delete ALL payments? This cannot be undone!'))return;try{await api({action:'reset_payments',password:pw});showMsg('ok','All payments deleted');loadAdmin(true);}catch(e){showMsg('er',e.message);}}
async function resetCustomers(){var pw=($('dangerPw')||{}).value;if(!pw)return showMsg('er','Enter admin password first');if(!confirm('FULL RESET: This will delete ALL customers, ALL licenses (including active ones), ALL devices, and ALL payments. ESP32 devices will revert to trial mode on next connection. This CANNOT be undone!\n\nAre you absolutely sure?'))return;if(!confirm('FINAL WARNING: Type YES in the next box to confirm.'))return;try{var r=await api({action:'reset_customers',password:pw});var msg='Full reset done. Deleted: '+r.deletedLicenses+' licenses';if(r.activeKeys&&r.activeKeys.length)msg+=' ('+r.activeKeys.length+' were active - use Recover tab to restore)';showMsg('ok',msg);loadAdmin(true);}catch(e){showMsg('er',e.message);}}
async function upFW(input,type){var file=input.files[0];if(!file)return;if(!file.name.endsWith('.bin')){showMsg('er','Only .bin files!');input.value='';return;}try{showMsg('ok','Uploading '+file.name+'...');var fn=type==='lcd'?'lcd_firmware.bin':'seg_firmware.bin';await uploadWithProgress(SB+'/storage/v1/object/firmware/'+fn,file,{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/octet-stream','x-upsert':'true'});await api({action:'upload_fw_url',type:type,filename:file.name});scClearAll();showMsg('ok','<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> Uploaded!');loadAdmin(true);}catch(e){showMsg('er',e.message);}input.value='';}
function dlFW(type){window.open(SB+'/storage/v1/object/public/firmware/'+(type==='lcd'?'lcd_firmware.bin':'seg_firmware.bin'),'_blank');}
function dlProduct(file){if(!file){showMsg('er','No firmware file uploaded');return;}try{fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'track_download',file:file})});}catch(e){}window.open(SB+'/storage/v1/object/public/firmware/'+file,'_blank');}

async function init(){
  // Quick health check — if server is down show friendly message instead of infinite loading
  try{
    var hc=await Promise.race([
      fetch('/api').then(function(r){return r.json();}),
      new Promise(function(_,rj){setTimeout(function(){rj(new Error('timeout'));},4000);})
    ]);
    if(hc&&hc.db==='unhealthy'){
      document.getElementById('app').innerHTML='<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px"><div style="font-size:52px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4a5 5 0 0 0-6.3 6.3L3 16v5h5l5.7-5.7A5 5 0 0 0 20 9l-3 3-2-2 3-3a5 5 0 0 0-3-3Z"/></svg></div><div style="color:#B45309;font-size:21px;font-weight:700;text-align:center">Server Maintenance</div><div style="color:#5A6B7F;font-size:16px;text-align:center;max-width:300px">Our server is temporarily unavailable. Please try again in a few minutes.</div><button onclick="location.reload()" style="background:#0369A1;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:17px;font-weight:600;cursor:pointer;margin-top:8px">Try Again</button></div>';
      return;
    }
  }catch(e){}
  var hasSession=false;
  try{hasSession=!!sessionStorage.getItem('nrActive');}catch(e){}
  if(!hasSession){
    ST.page='landing';ST.user=null;ST.ut=null;
    saveToken('');saveUser(null,null);authToken='';
  } else {
    loadUser();
  }
  // Show loading spinner while fetching data — prevents half-rendered first paint
  document.getElementById('app').innerHTML='<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="width:36px;height:36px;border:3px solid #E3E8EF;border-top-color:#0369A1;border-radius:50%;animation:spin 0.8s linear infinite"></div><div style="color:#5A6B7F;font-size:16px">Loading...</div></div>';
  // Fetch all public data in PARALLEL (not sequential)
  // FIX v30: Added 6s overall timeout — if Supabase is slow/sleeping, render anyway
  var fetchResult = await Promise.race([
    Promise.all([
      pubGetCached('site_settings','id=eq.1').catch(function(){return [];}),
      pubGetCached('payment_methods','active=eq.true&order=sort_order').catch(function(){return [];}),
      pubGetCached('downloads','active=eq.true&order=sort_order').catch(function(){return [];}),
      pubGetCached('products','active=eq.true&order=sort_order').catch(function(){return [];})
    ]),
    new Promise(function(resolve){setTimeout(function(){resolve([[],[],[],[]]);},6000);})
  ]);
  var ss=fetchResult[0],pm=fetchResult[1],dl=fetchResult[2],pd=fetchResult[3];
  if(ss&&ss[0])SS=ss[0]; PM=pm||[]; DL=dl||[]; PD=pd||[];
  if(ST.user&&authToken){
    try{if(ST.ut==='a'){var r2=await api({action:'dashboard'});AD=r2;ST.page='admin';}else{ST.page='customer';}}catch(e){ST.user=null;ST.ut=null;saveToken('');saveUser(null,null);ST.page='landing';}
  }
  render();
  // Keep session alive every 3 min while page is open and user is logged in
  setInterval(async function(){
    if(!authToken||!ST.user)return;
    try{
      if(ST.ut==='a'){var r=await api({action:'dashboard'});AD=r;render();}
      else await api({action:'my_licenses'});
    }catch(e){/* session expired, api() handles logout */}
  },180000);
  // Auto-refresh admin every 30 seconds - all stats update live
  setInterval(async function(){
    if(!authToken||!ST.user||ST.ut!=='a')return;
    try{
      var r=await api({action:'dashboard'});
      var oldPending=(AD.payments||[]).filter(function(p){return p.status==='pending'}).length;
      AD=r;
      var newPending=(r.payments||[]).filter(function(p){return p.status==='pending'}).length;
      if(newPending>oldPending)showMsg('ok','<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10.5 19a1.8 1.8 0 0 0 3 0"/></svg> New payment received!');
      render();loadAdmin();
    }catch(e){}
  },30000);
  // Auto-refresh customer licenses every 15 seconds for newly approved keys
  setInterval(async function(){
    if(!authToken||!ST.user||ST.ut!=='c')return;
    try{
      var r=await api({action:'my_licenses'});
      var newLics=r.licenses||[];
      var oldCount=(custCache||[]).length;
      if(newLics.length>oldCount){
        custCache=newLics;
        showMsg('ok','<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M15.5 12v2"/></svg> New license key received!');
        ST.tab='licenses';
        loadCust();
      } else {
        custCache=newLics;
      }
    }catch(e){}
  },15000);
}
// === IDLE AUTO-LOGOUT (2 minutes) ===
var idleTimeout=120000; // 2 minutes
var idleTimer=null;
function resetIdle(){
  if(idleTimer)clearTimeout(idleTimer);
  if(!authToken||!ST.user)return;
  idleTimer=setTimeout(function(){
    if(authToken&&ST.user){
      showMsg('er','Session expired due to inactivity');
      try{sessionStorage.removeItem('nrActive');}catch(x){}
      logout();
    }
  },idleTimeout);
}
['mousedown','touchstart','keydown','scroll','click','mousemove'].forEach(function(e){
  document.addEventListener(e,resetIdle,{passive:true});
});
resetIdle();
init();
</script>
